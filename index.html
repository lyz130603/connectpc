<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>远程鼠标</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui;
        }
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 14px;
            color: white;
            text-align: center;
            font-size: 16px;
        }
        .controlArea {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* 左边：4个系统按钮 */
        .sysBtns {
            position: absolute;
            left: 22px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .sysBtns button {
            width: 46px;
            height: 46px;
            border-radius: 10px;
            border: none;
            color: white;
            font-size: 12px;
        }
        .btn-min { background: rgba(100, 180, 240, 0.5); }
        .btn-max { background: rgba(80, 200, 120, 0.5); }
        .btn-close { background: rgba(60, 180, 220, 0.5); }
        .btn-shutdown { background: rgba(220, 80, 80, 0.6); }

        /* 右边：十字方向键 */
        .fine-tune {
            position: absolute;
            right: 22px;
            display: grid;
            grid-template-areas: ". up ." "left down right";
            gap: 8px;
        }
        .fine-tune button {
            width: 46px;
            height: 46px;
            border-radius: 10px;
            border: none;
            background: rgba(255,255,255,0.25);
            color: white;
            font-size: 18px;
        }
        .btn-up { grid-area: up; }
        .btn-left { grid-area: left; }
        .btn-down { grid-area: down; }
        .btn-right { grid-area: right; }

        /* 摇杆 */
        #joystickContainer {
            width: 200px;
            height: 200px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            position: relative;
        }
        #joystick {
            width: 70px;
            height: 70px;
            background: #ff5555;
            border-radius: 50%;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        /* 底部按钮 */
        .controlPanel {
            padding: 14px;
            background: white;
        }
        .controlButtons {
            display: flex;
            gap: 8px;
        }
        .controlButtons button {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: #667eea;
            color: white;
        }
        #log {
            height: 100px;
            background: #f6f6f6;
            padding: 8px;
            font-size: 12px;
            margin-top: 10px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="header">远程鼠标控制器</div>

    <div class="controlArea">
        <div id="joystickContainer"><div id="joystick"></div></div>

        <!-- 左边：4个系统按钮 -->
        <div class="sysBtns">
            <button class="btn-min" onclick="sendMin()">最小化</button>
            <button class="btn-max" onclick="sendMax()">最大化</button>
            <button class="btn-close" onclick="sendClose()">关闭窗口</button>
            <button class="btn-shutdown" onclick="sendShutdown()">关机</button>
        </div>

        <!-- 右边：十字方向键 -->
        <div class="fine-tune">
            <button class="btn-up" onclick="fine(0,-5)">↑</button>
            <button class="btn-left" onclick="fine(-5,0)">←</button>
            <button class="btn-down" onclick="fine(0,5)">↓</button>
            <button class="btn-right" onclick="fine(5,0)">→</button>
        </div>
    </div>

    <div class="controlPanel">
        <div class="controlButtons">
            <button onclick="clickLeft()">左键</button>
            <button onclick="clickRight()">右键</button>
            <button onclick="clickMiddle()">中键</button>
        </div>
        <div id="log"></div>
    </div>

    <script>
        const JOYSTICK_DELAY = 200;
        let lastMove = 0;

        function log(m) {
            let d = new Date().toLocaleTimeString();
            document.getElementById("log").innerHTML += `[${d}] ${m}\n`;
            document.getElementById("log").scrollTop = 99999;
        }

        // 发送指令
        async function send(cmd) {
            cmd.timestamp = Date.now();
            try {
                let res = await fetch("https://gitee.com/api/v5/repos/lyz123gitee/remote-control/contents/latest.json", {
                    method: "PUT",
                    headers: { "Authorization": "token 5883febd87fb1f63c452dcff144d18ac" },
                    body: JSON.stringify({
                        branch: "main",
                        message: "cmd",
                        content: btoa(JSON.stringify(cmd)),
                        sha: (await (await fetch("https://gitee.com/api/v5/repos/lyz123gitee/remote-control/contents/latest.json")).json()).sha
                    })
                });
                log("指令发送成功");
            } catch(e) { log("发送失败"); }
        }

        // 摇杆移动
        document.getElementById("joystickContainer").addEventListener("touchmove", e=>{
            let now = Date.now();
            if (now - lastMove < JOYSTICK_DELAY) return;
            lastMove = now;
            let dx = e.touches[0].clientX - window.innerWidth/2;
            let dy = e.touches[0].clientY - window.innerHeight/2 + 100;
            send({ type:"mouse_move", deltaX: Math.round(dx/2.5), deltaY: Math.round(dy/2.5) });
        });

        // 微调
        function fine(x,y) { send({ type:"mouse_move", deltaX:x, deltaY:y }); }

        // 点击
        function clickLeft() { send({ type:"mouse_click", button:"left" }); }
        function clickRight() { send({ type:"mouse_click", button:"right" }); }
        function clickMiddle() { send({ type:"mouse_click", button:"middle" }); }

        // 系统功能
        function sendMin() { send({ type:"key_press", key:"minimize" }); }
        function sendMax() { send({ type:"key_press", key:"maximize" }); }
        function sendClose() { send({ type:"key_press", key:"altf4" }); }
        function sendShutdown() { if(confirm("确定关机？")) send({ type:"system", action:"shutdown" }); }
    </script>
</body>
</html>
